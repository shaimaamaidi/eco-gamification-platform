<div class="w-full min-h-screen flex items-center justify-center relative overflow-hidden p-2 pt-4 pb-4">
  <!-- Background vert avec animations dynamiques -->
  <div class="absolute inset-0 bg-gradient-to-br from-emerald-400 via-teal-500 to-green-600 ">
    
    <!-- Cercles animés de différentes tailles -->
    <div class="absolute top-20 left-20 w-64 h-64 bg-white/10 rounded-full blur-3xl animate-circle-dance"></div>
    <div class="absolute top-40 right-32 w-48 h-48 bg-emerald-200/15 rounded-full blur-2xl animate-circle-dance-delayed"></div>
    <div class="absolute bottom-32 left-1/3 w-80 h-80 bg-teal-300/8 rounded-full blur-3xl animate-circle-float"></div>
    <div class="absolute top-1/2 right-20 w-32 h-32 bg-green-300/12 rounded-full blur-xl animate-circle-bounce"></div>
    <div class="absolute bottom-20 right-1/4 w-56 h-56 bg-white/6 rounded-full blur-2xl animate-circle-spiral"></div>
    
    <!-- Formes géométriques animées -->
    <div class="absolute top-1/4 left-1/4 w-24 h-24 bg-white/8 transform rotate-45 animate-shape-rotate blur-sm"></div>
    <div class="absolute bottom-1/3 right-1/3 w-16 h-16 bg-emerald-200/10 rounded-full animate-shape-pulse"></div>
    <div class="absolute top-2/3 left-1/6 w-20 h-20 bg-teal-300/12 transform rotate-12 animate-shape-wiggle blur-sm"></div>

    <svg class="absolute inset-0 w-full h-full animate-lines-flow" viewBox="0 0 1200 800" fill="none">
      <path d="M0 400 Q300 200 600 400 T1200 400" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" class="animate-path-draw"/>
      <path d="M0 300 Q400 500 800 300 T1200 300" stroke="rgba(255,255,255,0.48)" stroke-width="1.5" fill="none" class="animate-path-draw-delayed"/>
      <path d="M0 600 Q200 400 400 600 T800 600 T1200 600" stroke="rgba(255,255,255,0.46)" stroke-width="1" fill="none" class="animate-path-draw-slow"/>
    </svg>
    
    <!-- Particules flottantes plus nombreuses -->
    <div class="absolute top-16 left-16 animate-particle-float text-2xl text-white/18">🌿</div>
    <div class="absolute top-32 right-1/4 animate-particle-float-delayed text-2xl text-white/20">🌼</div>
    <div class="absolute bottom-48 right-10 animate-particle-float-slow text-lg text-white/15">🌱</div>
    <div class="absolute bottom-40 left-13 animate-particle-float text-xl text-white/22">🌳</div>
    
    <!-- Points lumineux animés -->
    <div class="absolute top-24 right-1/5 w-4 h-4 bg-white/25 rounded-full animate-light-twinkle"></div>
    <div class="absolute bottom-40 left-1/5 w-3 h-3 bg-emerald-200/30 rounded-full animate-light-twinkle-delayed"></div>
    <div class="absolute top-2/3 right-1/6 w-2 h-2 bg-teal-200/35 rounded-full animate-light-twinkle-slow"></div>
    <div class="absolute top-1/3 left-2/3 w-5 h-5 bg-white/20 rounded-full animate-light-twinkle-fast"></div>
    
    <!-- Effet de respiration global -->
    <div class="absolute inset-0 bg-gradient-radial from-white/3 via-transparent to-emerald-400/5 animate-background-breathe"></div>
  </div>

  <!-- Formulaire statique (sans animation) -->
  <div class="custom-size w-full max-w-xl sm:max-w-lg md:max-w-md lg:max-w-lg xl:max-w-xl 2xl:max-w-2xl shadow-2xl border-0 bg-[#EEF9FB]/80  backdrop-blur-md text-black relative z-10 rounded-xl mx-4" style="box-shadow: 0 -5px 0 0 rgba(0,0,0,0.15),0 5px 0 0 rgba(0,0,0,0.15)">
    <div class="p-8 text-center">
      <div class="mx-auto w-16 h-16 bg-gradient-to-br from-emerald-400 to-teal-500 rounded-full flex items-center justify-center shadow-lg mb-4">
        <img src="/assets/logo.png" alt="Logo" class="w-15 h-15" />
      </div>
      <h1 class="text-2xl font-bold text-black mb-2">EcoPoints</h1>
      <p class="text-[#707883]">Connectez-vous pour continuer à sauver la planète</p>
    </div>
    
    <div class="px-8">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div *ngIf="errorMessage && submitButtonCliqued" class="bg-red-500 border border-red-500 rounded-lg p-3 flex items-center text-red-200 text-sm">
          <span class="mr-2">⚠️</span>
          {{ errorMessage }}
        </div>
         
        <div class="space-y-2">
          <label for="email" class="text-[#3E4857] text-sm font-medium">Adresse email</label>
          <div class="relative">
            <img src="assets/mail.svg" alt="Mail" class="w-6 h-6 absolute left-3 top-3" />
            <input
              type="email"
              id="email"
              formControlName="email"
              placeholder="votre@email.com"
              class="w-full h-12 pl-12 bg-white/5 border border-gray-400 rounded-md text-black placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all"
              [class.border-red-500]="email?.invalid && email?.touched"
            >
          </div>
          <div *ngIf="email?.invalid && (email?.touched || submitButtonCliqued)" class="text-red-500 font-bold text-xs font-semibold">
            <span *ngIf="email?.errors?.['required']">L'email est requis</span>
            <span *ngIf="email?.errors?.['email']">Format d'email invalide</span>
          </div>

        </div>
        
        <div class="space-y-2">
          <label for="password" class="text-[#3E4857] text-sm font-medium">Mot de passe</label>
          <div class="relative">
            <img src="assets/password.svg" alt="Password" class="w-6 h-6 absolute left-3 top-3" />
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              formControlName="password"
              placeholder="••••••••"
              class="w-full h-12 pl-12 bg-white/5 border border-gray-400 rounded-md text-black placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all"
              [class.border-red-500]="password?.invalid && password?.touched"
            >
            <button
              type="button"
              (click)="togglePassword()"
              class="absolute right-3 top-3 text-xl text-gray-400 hover:text-black transition-colors"
            >
              <img *ngIf="showPassword" src="assets/hide.svg" alt="Cacher" class="w-6 h-6" />
              <img *ngIf="!showPassword" src="assets/show.svg" alt="Afficher" class="w-6 h-6"/>
            </button>
           </div>
          <div *ngIf="password?.invalid && (password?.touched || submitButtonCliqued)" class="text-red-500 font-bold text-xs font-semibold">
            <span *ngIf="password?.errors?.['required']">Le mot de passe est requis</span>
          </div>
        </div>
        
        <div class="espace"></div>

        <div class="text-center">
          <a href="/forget_password" class="text-emerald-600 hover:text-emerald-700 transition-colors text-sm">
            Mot de passe oublié ?
          </a>
        </div>
        
        <button
          type="submit"
          [disabled]="isLoading || (loginForm.invalid  && submitButtonCliqued)"
          class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-semibold h-12 rounded-lg transition-all duration-200 shadow-lg hover:shadow-xl disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center"
        >
          <span *ngIf="!isLoading">Se connecter</span>
          <div *ngIf="isLoading" class="flex items-center">
            <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-white mr-2"></div>
            Connexion...
          </div>
        </button>
      </form>
    </div>
    <div class="espace_2"></div>
    <div class="p-8 pt-4">
      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-white/10"></div>
        </div>
        <div class="relative flex justify-center"></div>
      </div>
      <p class="text-center text-sm text-gray-500 mt-6">
        Nouveau sur EcoPoints ?
        <button (click)="goToSignUp()" class="text-emerald-600 hover:text-emerald-700 transition-colors ml-1">
          Créer un compte
        </button>
      </p>
      
      <div class="text-center text-xs text-gray-500 mt-4">
        <p>🌱 Chaque connexion compte pour la planète</p>
      </div>
    </div>
  </div>
</div>
