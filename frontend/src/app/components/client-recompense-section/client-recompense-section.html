<div *ngIf="!isLoadingData; else loading" class="relative bg-[#DCFCE7] rounded-2xl p-2 h-full w-full">
  <ng-container *ngIf="recompenses.length > 0; else noRecompenses">
    <div class="bg-white grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 p-2 border border-gray-200 rounded-2xl shadow-inner"> 
      <div *ngFor="let recompense of recompenses"   
          [ngClass]="{ 
          'p-4 rounded-xl border-2 transition-all': true,
          'bg-gradient-to-br from-blue-50 to-blue-300 border-blue-200': (recompense.progress ?? 0)===100,
          'bg-gray-50 border-gray-200 opacity-75 pointer-events-none cursor-not-allowed': (recompense.progress ?? 0)<100}">
        
        <!-- Icône ou espaceur vide -->
        <div class="flex-shrink-0">
          <ng-container *ngIf="recompense.icon; else emptyIcon">
            <img [src]="'data:image/' + recompense.extension + ';base64,' + recompense.icon" alt="Icone Badge" 
            class="w-[150px] h-[150px] pb-2"
             [ngClass]="{'filter grayscale opacity-50': (recompense.progress ?? 0) < 100}" />
          </ng-container>
          <ng-template #emptyIcon>
            <!-- espaceur invisible mais qui prend place -->
            <div class="w-[150px] h-[150px] pb-2 invisible"></div>
          </ng-template>
        </div>
        
        <h4 class="font-bold mb-2" [ngClass]="{'text-gray-900':( recompense.progress ?? 0)>=100, 'text-gray-500': ( recompense.progress ?? 0)<100}">
          {{ recompense.name }}
        </h4>
        
        <p class="text-sm mb-3" [ngClass]="{'text-gray-600': ( recompense.progress ?? 0)>=100, 'text-gray-400':( recompense.progress ?? 0)<100}">
          {{ recompense.description }}
        </p>
        
        <div class="text-sm font-semibold mb-3 " [ngClass]="{'text-blue-600': ( recompense.progress ?? 0)>=100, ' text-gray-400': ( recompense.progress ?? 0)<100}">
          <p class="text-left">Badges requis : {{ recompense.requiredBadges }} </p>
        </div>
        
        <div class="w-full bg-gray-200 rounded-full h-2 mb-2">
          <div
            class="h-2 rounded-full transition-all duration-500"
            [ngClass]="{
              'bg-blue-400 ': ( recompense.progress ?? 0)>=100,
              'bg-gray-300': ( recompense.progress ?? 0)<100}"
            [style.width.%]="recompense.progress">
          </div>
        </div>
        
        <p class="w-full text-right text-xs pb-2" 
          [ngClass]="{ 'text-blue-600': ( recompense.progress ?? 0)>=100, 'text-gray-400': ( recompense.progress ?? 0)<100  }">
          {{ recompense.progress | number:'1.1-1' }}%
        </p>
      </div>
    </div>
  </ng-container>

  <ng-template #noRecompenses>
    <div class="flex justify-center items-center text-center h-64 bg-white text-gray-500 font-medium">
      Pas de récompense pour l'instant
    </div>
  </ng-template>
</div>
<ng-template #loading>
    <div class="relative bg-[#DCFCE7] rounded-2xl p-2 gap-4 min-h-[300px] mt-10 pt-10">
      <app-loading-dots></app-loading-dots>
    </div>
</ng-template>
