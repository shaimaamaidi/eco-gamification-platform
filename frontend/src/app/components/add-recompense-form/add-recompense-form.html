<div class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 p-4 sm:p-6 max-h-full overflow-auto ">
  <div class="relative bg-white rounded-xl shadow-xl p-2 sm:p-6 md:p-8 w-full max-w-lg overflow-auto flex flex-col">

    <!-- Bouton de fermeture -->
    <button
      type="button"
      (click)="closeForm()"
      class="absolute top-1 right-1 text-gray-500 hover:text-red-600 text-xl font-bold">
      <img src="/assets/x.svg" alt="Fermer" />
    </button>

    <!-- Titre -->
    <h2 class="text-lg sm:text-xl font-semibold text-center mb-5 text-black">
      Ajouter une Nouvelle Récompense
    </h2>

    <!-- Formulaire -->
    <form [formGroup]="addRecompenseForm" (ngSubmit)="onSubmit()" class="flex flex-col flex-grow space-y-4">

      <!-- Nom -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nom de la récompense</label>
        <input
          type="text"
          formControlName="name"
          placeholder="Ex: Super Écolo"
          class="w-full h-11 px-4 bg-white/5 border border-gray-400 rounded-md text-black placeholder:text-gray-400 
                 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all" />
        <div *ngIf="name?.invalid && (name?.touched || submitClicked)" class="text-red-500 text-xs mt-1">
          Le nom est requis.
        </div>
      </div>

      <!-- Description -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <textarea
          rows="4"
          formControlName="description"
          placeholder="Entrez la description"
          class="w-full px-4 py-2 bg-white/5 border border-gray-400 rounded-md text-black placeholder:text-gray-400 
                 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all"></textarea>
        <div *ngIf="description?.invalid &&  submitClicked" class="text-red-500 text-xs mt-1">
          La description est requise.
        </div>
      </div>

      <!-- Nombre de badges requis -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre de badges requis</label>
        <input
          type="number"
          min="0"
          formControlName="requiredBadges"
          placeholder="Ex: 5"
          class="w-full h-11 px-4 bg-white/5 border border-gray-400 rounded-md text-black placeholder:text-gray-400 
                 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all" />
        <div *ngIf="requiredBadges?.invalid && (requiredBadges?.touched || submitClicked)" class="text-red-500 text-xs mt-1">
          Le nombre de badges requis doit être un nombre positif.
        </div>
      </div>

      <!-- Icône -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Icône</label>
        <input
          type="file"
          accept="image/*"
          formControlName="icon"
          (change)="onIconFileChange($event)"
          class="w-full h-11 px-4 mt-1 bg-white/5 border border-gray-400 rounded-md text-black 
                 file:bg-transparent file:text-black file:border-0 file:py-3 file:rounded-md 
                 file:cursor-pointer focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all" />
        <div *ngIf="icon?.invalid && (icon?.touched || submitClicked)" class="text-red-500 text-xs mt-1">
          L’icône est requise.
        </div>
      </div>

      <!-- Bouton centré -->
      <div class="mt-4 flex justify-center">
        <button
          type="submit"
          [disabled]="addRecompenseForm.invalid && submitClicked"
          class="w-1/2 bg-emerald-500 hover:bg-emerald-600 text-white font-semibold rounded-lg px-6 py-2 
                 disabled:opacity-50 disabled:cursor-not-allowed transition-colors duration-200">
          <span *ngIf="!isLoading">Ajouter</span>
          <div *ngIf="isLoading" class="flex items-center justify-center">
            <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-white mr-2"></div>
            <span>Ajout en cours...</span>
          </div>
        </button>
      </div>
    </form>
  </div>
</div>
