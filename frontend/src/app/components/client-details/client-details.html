<div class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 p-4 sm:p-6">
  <div class="relative bg-white rounded-xl shadow-xl p-6 md:p-8 w-full max-w-md sm:max-w-lg flex flex-col items-center gap-6">
    
    <!-- Avatar avec initiale ou image -->
    <div class="h-16 w-16 rounded-full bg-gradient-to-br from-emerald-400 to-teal-500 flex items-center justify-center text-white font-semibold text-2xl select-none">
      <ng-container *ngIf="client.userName; else userIcon">
        {{ client.userName[0].toUpperCase() }}
      </ng-container>
      <ng-template #userIcon>
        <img src="/assets/user.svg" alt="User Icon" class="h-10 w-10" />
      </ng-template>
    </div>

    <!-- Détails client -->
    <div class="w-full max-w-sm text-left grid grid-cols-2 gap-y-3 gap-x-6 items-center">
      <div class="font-semibold text-gray-700">Nom & Prénom:</div>
      <div class="text-black">{{ client.userName }}</div>
 
      <div class="font-semibold text-gray-700">Mail:</div>
      <div class="text-black sm:break-normal break-words col-span-2 sm:col-span-1">{{ client.mail }}</div>

      <div class="font-semibold text-gray-700">Ville:</div>
      <div class="text-black">{{ client.city }}</div>

      <div class="font-semibold text-gray-700">Points totals:</div>
      <div class="text-black">{{ client.totalPoints }}</div>
    </div>

  </div>
</div>
