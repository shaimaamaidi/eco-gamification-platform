<div
  class="flex items-center gap-3 p-3 rounded-md transition-all duration-200"
  [ngClass]="{
    'bg-gray-100 font-semibold border border-gray-600': isCurrentUser,
    'hover:bg-muted/50': !isCurrentUser
  }">
  <div class="w-8 flex items-center text-center text-lg font-bold grid grid-cols-2" [ngClass]="{'ml-4': client.rank !== 1}">
    <ng-container *ngIf="client.rank === 1">
      <img src="/assets/crown.svg" class="h-5 w-5" />
    </ng-container>
    {{ client.rank }}
  </div>  

  <div class="relative h-9 w-9 rounded-full overflow-hidden border-2 border-primary/50">
     <img
      *ngIf="hasImage"
      class="h-full w-full object-cover"
      [src]="client.profileImage"
      [alt]="client.name"/>
    <div
      *ngIf="!client.profileImage"
      class="absolute inset-0 flex items-center justify-center bg-gray-200 text-gray-600 font-semibold">
      {{ avatarFallback }}
    </div>
  </div>

  <div class="flex-grow">
    <p class="font-medium">{{ client.name }}</p>
  </div>

  <div class="flex items-center gap-1 text-sm text-muted-foreground">
    <img src ="/assets/star.svg" class="h-4 w-4 text-yellow-400" />
    {{ client.points }} points
  </div>
</div>
