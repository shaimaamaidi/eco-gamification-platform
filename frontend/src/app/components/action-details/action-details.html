<div class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 p-4 sm:p-6">
 
  <div class="relative bg-white rounded-xl shadow-xl p-4 sm:p-6 md:p-8 w-full max-w-md sm:max-w-lg">
    <button
      type="button"
      (click)="closeDeatil()"
      class="absolute top-1 right-1 text-gray-500 hover:text-red-600 text-xl font-bold">
      <img src="/assets/x.svg" alt="Fermer"/>
    </button>
    <img [src]="'data:image/' + action.extension + ';base64,' + action.image"  alt="{{action.type}}" class="mx-auto w-80 h-[250px] mb-6" />
    
    <div class="flex justify-center">
      <div class="grid grid-cols-2 gap-2 max-w-sm text-left items-center">
        <div *ngIf="isAdmin" class="font-semibold text-gray-700">Client:</div>
        <div *ngIf="isAdmin" class="text-black sm:break-normal break-words col-span-2 sm:col-span-1">{{ action.mailClient }}</div>

        <div class="font-semibold text-gray-700">Type:</div>
        <div class="text-black">{{ action.type }}</div>

        <div class="font-semibold text-gray-700">Status:</div>
        <div>
          <p
            class="font-semibold text-black"
            [ngClass]="getStatusClass(action.status ?? '')">
            {{ action.status }}
          </p>  
        </div>

        <div class="font-semibold text-gray-700">Date:</div>
        <div>{{ action.date }}</div>

        <div class="font-semibold text-gray-700">Points:</div>
        <div class="font-bold text-emerald-600">+{{ action.awardPoints ?? 0 }} pts</div>

        <div *ngIf="action.feedback" class="font-semibold text-gray-700">Feedback:</div>
        <div *ngIf="action.feedback" class="text-red-600 ml-1 break-words">{{ action.feedback }}</div>
      </div>
    </div>

    <!-- Boutons Valider / Rejeter si status = waiting -->
    <div *ngIf="action.status?.toLowerCase() === 'waiting' && isAdmin" class="mt-2 grid grid-cols-2 gap-3 items-center justify-center">
        <button 
            (click)="validateAction()"
            class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-semibold h-12 rounded-lg transition-all duration-200 shadow-lg hover:shadow-xl disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center">
            <span *ngIf="!isLoading">Accepter</span>
            <div *ngIf="isLoading" class="flex items-center justify-center">
              <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-white mr-2"></div>
              Acceptation en cours...
            </div>
        </button>
        <button  
            (click)="rejectAction()"
            class="w-full bg-gradient-to-r from-red-500 to-red-500 hover:from-red-600 hover:to-red-600 text-white font-semibold h-12 rounded-lg transition-all duration-200 shadow-lg hover:shadow-xl disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center">
            Rejeter
        </button>
    </div>
  </div>
  <app-feedback-form 
    *ngIf="showFeedbackForm" 
    [action]="action"
    (close)="closeFeedBackForm()"
    (reloadData)="reloadData.emit()"
    (closeDetail)="closeDeatil()">
  </app-feedback-form>
</div>
