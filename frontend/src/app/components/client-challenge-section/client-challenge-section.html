<div *ngIf="!isLoadingData; else loading" class="relative bg-[#DCFCE7] rounded-2xl p-2 h-full w-full">
  <ng-container *ngIf="challenges.length > 0; else noChallenges">
    <div class="bg-white grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 p-2 border border-gray-200 rounded-2xl shadow-inner">
      <div *ngFor="let challenge of challenges"
        [ngClass]="{
          'p-4 rounded-xl border-2 transition-all': true,
          'bg-gradient-to-br from-blue-50 to-blue-300 border-blue-200': (challenge.progress ?? 0)===100,
          'bg-gray-50 border-gray-200 opacity-75 pointer-events-none cursor-not-allowed': (challenge.progress ?? 0)<100}">
          
        <div class="flex items-center justify-between mb-3">
            
          <!-- Icône ou espaceur vide -->
          <div class="flex-shrink-0">
            <ng-container *ngIf="challenge.icon; else emptyIcon">
              <img [src]="'data:image/' + challenge.extension + ';base64,' + challenge.icon" alt="Icone Badge" class="w-[150px] h-[150px] pb-2" />
            </ng-container>
            <ng-template #emptyIcon>
              <!-- espaceur invisible mais qui prend place -->
              <div class="w-[150px] h-[150px] pb-2 invisible"></div>
            </ng-template>
          </div>
            
          <div class="flex items-center text-gray-500 text-xs gap-1">
            <img src="/assets/clock.svg" class="w-3 h-3"/>
            <p>{{ getDaysBeforeExpiration(challenge.endDate ?? "") }}</p>
          </div>
        </div>
          
        <h4 class="font-bold text-gray-900 mb-2">{{ challenge.title }}</h4>
          
        <p class="text-gray-600 text-sm mb-4">{{ challenge.description }}</p>
          
        <div class="flex items-center justify-between mb-3">
          
          <span class="text-sm font-semibold" [ngClass]="{'text-blue-600': (challenge.progress ?? 0)===100, ' text-gray-400': (challenge.progress ?? 0) <100}">
            Nombre d'actions requis : {{ challenge.goal }}
          </span>
          
          <span [ngClass]="(challenge.progress ?? 0) >=100? 'text-blue-600' : 'text-gray-600'" class="text-sm font-semibold">
            {{ challenge.progress | number:'1.1-1' }}%
          </span>
        </div>
          
        <div class="w-full bg-gray-200 rounded-full h-3">
          <div
            class="h-3 rounded-full transition-all duration-500"
            [ngClass]="(challenge.progress ?? 0)>=100 ? 'bg-gradient-to-r from-blue-400 to-blue-500' : 'bg-gradient-to-r from-gray-400 to-gray-500'"
            [style.width.%]="challenge.progress"
          ></div>
        </div>
      </div>
    </div>
  </ng-container>

  <ng-template #noChallenges>
    <div class="flex justify-center items-center h-64 bg-white text-gray-500 font-medium">
      Pas de défis pour l'instant
    </div>
  </ng-template>
</div>
<ng-template #loading>
    <div class="relative bg-[#DCFCE7] rounded-2xl p-2 gap-4 min-h-[300px] mt-10 pt-10">
        <app-loading-dots></app-loading-dots>
    </div>
</ng-template>
