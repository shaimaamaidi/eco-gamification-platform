
<div [ngClass]="getSidebarClasses()"
  (transitionend)="onTransitionEnd($event)"
  class="z-10 text-white transition-all duration-300 min-h-screen relative">

  <!-- Toggle Button -->
  <button
     *ngIf="!isMobile"
     [ngClass]="getToggleButtonPositionClass()"
     class="absolute bg-white text-emerald-600 rounded-full p-1 shadow-lg hover:bg-emerald-50 transition-colors flex items-center justify-center">
    <img *ngIf="isExpanded" src="assets/left.svg" (click)="close()" alt="left" class="w-6 h-6 flex-shrink-0 transition-all duration-300" />
    <img *ngIf="!isExpanded" src="assets/right.svg" (click)="open()" alt="Right" class="w-6 h-6 flex-shrink-0 transition-all duration-300" />
  </button>

  <div *ngIf="!isMobile || isExpanded" class="pt-3 pb-4">
    <!-- Logo -->
    <div class="p-2 border-b border-gray-200 flex items-center gap-2">
      <div class="flex items-center justify-center rounded-xl bg-gradient-to-br from-emerald-400 to-teal-500 shadow-lg "
          [ngClass]="{ 'w-16 h-16 transition-all duration-200 fade-out': isExpanded, 'w-15 h-15 transition-all duration-300 fade-in ': !isExpanded }">
        <img src="/assets/logo.png" alt="Logo"
            [ngClass]="{ 'w-15 h-15': isExpanded, 'w-12 h-12': !isExpanded }"
            class="transition-all duration-300" />
      </div>
      <div *ngIf="isExpanded" class="transition-all duration-200 fade-out">
        <h1 class="text-xl font-bold text-gray-800">EcoPoints</h1>
        <p class="text-xs text-white">Sauvons la nature</p>
      </div>
    </div>

    <!-- User Profile -->
    <div class="p-4 border-b border-gray-200">
      <div class="flex items-center gap-3">
        <div 
          [ngClass]="{ 'transition-all duration-200 fade-out': isExpanded, 'transition-all duration-300 fade-in ': !isExpanded }"
          class="h-12 w-12 rounded-full bg-gradient-to-br from-emerald-400 to-teal-500 flex items-center justify-center text-white font-semibold text-xl">
          {{ currentUser? currentUser.userName[0] : 'U' }}
        </div>
        <div *ngIf="isExpanded" class="flex-1 transition-all duration-200 fade-out">
          <p class="font-semibold font-bold text-gray-800">{{currentUser ? currentUser.userName : "User"}}</p>
          <p *ngIf="!isAdmin" class="text-sm text-white">{{currentUser ? currentUser.totalPoints : 0}} points</p>
        </div>
      </div>
    </div>

    <!-- Menu Items -->
    <nav class="flex-1 p-2 overflow-y-auto max-h-[calc(100vh-160px)]">
      <div class="space-y-1 ">
        <a [routerLink]="getRouterLink(item)"
          *ngFor="let item of menuItems"
          (click)="onSelectSection(item)"
          routerLinkActive="bg-white bg-opacity-30 text-white"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center rounded-xl transition-all px-3 text-emerald-200 hover:bg-white hover:bg-opacity-10 hover:text-white"
          [ngClass]="{
              'w-56 h-14 transition-all duration-200 fade-out': isExpanded,    
              'w-12 h-12 transition-all duration-300 fade-in': !isExpanded}">
          <img [src]="item.icon"
              class=" w-6 h-6 flex-shrink-0 transition-all duration-300" />
          <span *ngIf="isExpanded" class="ml-3 font-medium transition-all duration-200 fade-out">{{ item.name }}</span>
          </a>
      </div>
    </nav>
  </div>
</div>
