# Nom de l'application
spring.application.name=${MYSQL_DATABASE}

# Connexion MySQL (variables inject�es par Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Activer l'endpoint health
management.endpoints.web.exposure.include=health

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JSON / Multipart
spring.mvc.converters.preferred-json-mapper=jackson
spring.servlet.multipart.max-file-size=100MB

# S�curit� JWT
application.security.jwt.secret-key=4a04da2cd6eaf0f86609eadfc4bc720208a5a5de9ea074a8626e56fdb44e7033
application.security.jwt.expiration=1800000
application.security.jwt.refresh_token.expiration=86400000

# Mail
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
